name: Documentation
on:
  push:
    branches: [test, dev, main]
  pull_request:
    branches: [test, dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/actionlint
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore documentation tools only
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: overview:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-docs-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-docs-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - run: make ci-local
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
  promotion:
    if: github.event_name == 'pull_request'
    uses: pokerlost/.github/.github/workflows/promotion.yml@637ff1b505b0b9fb54847d46927a9596b1ebc967
  release:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: pokerlost/.github/.github/workflows/release.yml@637ff1b505b0b9fb54847d46927a9596b1ebc967
    with:
      provider-ref: 637ff1b505b0b9fb54847d46927a9596b1ebc967
      native-adapter: version-file
      bundle-name: pokerlost-overview
      source-workflow: .github/workflows/ci.yml
      gate-name: validate
