name: Feature proposal
description: Describe a concrete problem and the intended boundary of a change.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain who needs the behavior and a concrete example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Include compatibility and data ownership where relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable result, validation scope and exclusions.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Goal, dependencies and decisions
      description: Link existing issues, ADRs and owning code; do not duplicate private content.
